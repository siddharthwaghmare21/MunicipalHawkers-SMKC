services:
  - type: web
    name: municipal-hawkers-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: MunicipalHawkers
      - key: JWT_AUDIENCE
        value: MunicipalHawkersClients
